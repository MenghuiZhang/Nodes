services:
  nodes:
    # CI 构建的镜像：ghcr.io/<owner>/nodes:latest（本地构建可改回 nodes:local）
    image: ghcr.io/menghuizhang/nodes:latest
    build:
      context: .
    stdin_open: true
    tty: true
    shm_size: "2gb"
    volumes:
      - ./data/account:/app/account
      - ./data/node:/app/node
      - ./config.local.json:/app/config.local.json:ro
    restart: "no"

  dashboard:
    image: ghcr.io/menghuizhang/nodes:latest
    entrypoint:
      - gunicorn
    command:
      - --bind=0.0.0.0:8080
      - --workers=1
      - --threads=8
      - --timeout=900
      - --access-logfile=-
      - web_app:app
    volumes:
      - ./data/account:/app/account
      - ./data/node:/app/node
      - ./data/web:/app/web-data
      # 必须可写：控制台保存设置会原子重写 config.local.json，:ro 会导致保存失败。
      - ./config.local.json:/app/config.local.json
    restart: unless-stopped

  dashboard-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - dashboard
    ports:
      - "8443:443"
    volumes:
      - ./dashboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
